<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" fill="none">
  <!-- 背景：与首页一致的浅色点阵 -->
  <rect width="1600" height="960" fill="#FAFAFA"/>
  <defs>
    <pattern id="dots" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#000" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CED4DE" stop-opacity="0.45"/>
      <stop offset="0.3" stop-color="#CED4DE" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#CED4DE" stop-opacity="0"/>
      <stop offset="1" stop-color="#CED4DE" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="960" fill="url(#dots)"/>
  <rect width="1600" height="960" fill="url(#wash)"/>

  <!-- 居中卡片 -->
  <rect x="330" y="150" width="940" height="660" rx="16" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1.5"/>
  <!-- 卡片顶部细色条 -->
  <rect x="330" y="150" width="940" height="6" rx="3" fill="#0052D9"/>

  <!-- 顶部标签 -->
  <text x="800" y="262" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="600" letter-spacing="6" fill="#6B6B6B">TENPAY GLOBAL</text>

  <!-- 主标题 -->
  <text x="800" y="432" text-anchor="middle" font-family="Lora, Georgia, serif" font-size="128" font-weight="600" letter-spacing="-2" fill="#000000">Sharelink</text>

  <!-- 副标题 -->
  <text x="800" y="520" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="400" letter-spacing="4" fill="#333333">全球汇入体验优化</text>

  <!-- 底部时间 -->
  <text x="800" y="700" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" letter-spacing="2" fill="#8F8F8F">2026 · DESIGN DRIVEN</text>
</svg>
